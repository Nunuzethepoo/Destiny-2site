<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test du manifest</title>
  <link rel="stylesheet" href="vigie.css">
  <script src="vigie-shell.js" defer></script>
</head>
<body>
  <h1>Test du manifest</h1>
  <button id="lancer">Télécharger les définitions d'objets</button>
  <p id="statut"></p>

  <script src="bungie-api.js"></script>
  <script>
    const LANGUE = "fr";

    document.getElementById("lancer").addEventListener("click", async function () {
      const statut = document.getElementById("statut");

      try {
        // Étape 1 : où se trouvent les fichiers de définitions ?
        statut.textContent = "Étape 1 : recherche de l'adresse...";
        const reponseManifest = await VIGIE_BUNGIE.fetchApi("/Destiny2/Manifest/");
        const manifest = await reponseManifest.json();
        const chemins = manifest.Response.jsonWorldComponentContentPaths[LANGUE];

        // On essaie d'abord la version allégée, sinon la version complète
        let nomDefinition = "DestinyInventoryItemLiteDefinition";
        let chemin = chemins[nomDefinition];
        if (!chemin) {
          nomDefinition = "DestinyInventoryItemDefinition";
          chemin = chemins[nomDefinition];
        }

        // Étape 2 : téléchargement
        statut.textContent = "Étape 2 : téléchargement de " + nomDefinition + " (patience)...";
        const debut = Date.now();
        const reponse = await VIGIE_BUNGIE.fetchPublic(chemin);
        const definitions = await reponse.json();
        const secondes = ((Date.now() - debut) / 1000).toFixed(1);

        // Étape 3 : on compte les armures (itemType 2)
        const liste = Object.values(definitions);
        const armures = liste.filter(function (d) {
          return d.itemType === 2;
        });

        statut.textContent =
          "Terminé en " + secondes + " s. " +
          liste.length + " objets, dont " + armures.length + " armures. " +
          "Exemple de champs disponibles : " + Object.keys(armures[0]).join(", ");
      } catch (erreur) {
        statut.textContent = "Erreur : " + erreur;
      }
    });
  </script>
</body>
</html>
