<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Équiper un set</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    pre { background: #101720; padding: 12px; white-space: pre-wrap; border: 1px solid #344251; border-radius: 3px; color: #d7e0e8; }
    .set { display: grid; gap: 12px; margin: 14px 0; padding: 16px; border: 1px solid #344251; border-radius: 4px; background: #111820; }
    .set-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .set-actions button, .editor-actions button { min-height: 38px; padding: 8px 12px; border: 1px solid #b9975d; border-radius: 3px; background: #d4ad680d; color: #e3c58e; font-weight: 700; cursor: pointer; }
    .set-actions button:hover, .editor-actions button:hover { background: #d4ad6822; }
    .set-editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; padding: 14px; border: 1px solid #344251; background: #0a1016; }
    .set-editor[hidden] { display: none; }
    .edit-field { display: grid; gap: 6px; color: #aebbc7; font-size: 11px; font-weight: 700; }
    .edit-field select { width: 100%; min-height: 40px; padding: 8px; border: 1px solid #344251; border-radius: 3px; background: #111820; color: #edf1f4; }
    .editor-help { grid-column: 1 / -1; margin: 0; color: #9eabb7; font-size: 11px; line-height: 1.6; }
    .editor-actions { display: flex; gap: 8px; grid-column: 1 / -1; }
    .editor-actions .cancel-edit { border-color: #526170; color: #bdc8d2; }
    .set-summary { color: #d7e0e8; font-size: 13px; line-height: 1.6; }
    .set-details { color: #adbac6; font-size: 11px; }
    @media(max-width: 520px) { body { padding: 14px; } }
  </style>
  <link rel="stylesheet" href="vigie.css">
  <script src="vigie-shell.js" defer></script>
</head>
<body>
  <h1>Équiper un build</h1>
  <p id="statut">Chargement...</p>

  <p>Personnage cible :
    <select id="choixPersonnage"></select>
  </p>

  <h2>Mes sets</h2>
  <div id="sets"></div>

  <h2>Journal</h2>
  <pre id="journal">(vide)</pre>

  <p><a href="generateur.html">Créer des builds</a> | <a href="arsenal.html">Mon arsenal</a></p>

  <script src="bungie-api.js"></script>
  <script>
    const jeton = sessionStorage.getItem("jeton");

    const statut = document.getElementById("statut");
    const choixPersonnage = document.getElementById("choixPersonnage");
    const zoneSets = document.getElementById("sets");
    const zoneJournal = document.getElementById("journal");

    const CLASSES = { 0: "Titan", 1: "Chasseur", 2: "Arcaniste" };
    const ARMURES = [
      { bucket: 3448274439, nom: "Casque" },
      { bucket: 3551918588, nom: "Gants" },
      { bucket: 14239492, nom: "Torse" },
      { bucket: 20886954, nom: "Jambes" },
      { bucket: 1585787867, nom: "Objet de classe" }
    ];
    const ARMES = [
      { bucket: 1498876634, nom: "Cinétique" },
      { bucket: 2465295065, nom: "Énergie" },
      { bucket: 953998645, nom: "Puissante" }
    ];

    let compte = null;
    let personnages = {};
    let objetsDisponibles = [];
    const sets = JSON.parse(localStorage.getItem("setsArmures")) || [];

    // ---------- Le journal ----------
    function viderJournal() {
      zoneJournal.textContent = "";
    }
    function ecrire(texte) {
      if (zoneJournal.textContent === "(vide)") {
        zoneJournal.textContent = "";
      }
      zoneJournal.textContent += texte + "\n";
    }

    // Une petite pause (en millisecondes) entre deux demandes
    function pause(ms) {
      return new Promise(function (resolve) {
        setTimeout(resolve, ms);
      });
    }

    // ---------- Parler à Bungie ----------
    async function appelerBungie(chemin) {
      const reponse = await VIGIE_BUNGIE.fetchApi(chemin, {
        headers: { "Authorization": "Bearer " + jeton }
      });
      const donnees = await reponse.json();
      if (donnees.ErrorStatus !== "Success") {
        throw new Error(donnees.ErrorStatus + " - " + donnees.Message);
      }
      return donnees.Response;
    }

    // Même chose, mais pour ENVOYER un ordre (méthode POST)
    async function envoyerBungie(chemin, corps) {
      const reponse = await VIGIE_BUNGIE.fetchApi(chemin, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + jeton,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(corps)
      });
      const donnees = await reponse.json();
      if (donnees.ErrorStatus !== "Success") {
        throw new Error(donnees.ErrorStatus + " - " + donnees.Message);
      }
      return donnees.Response;
    }

    // ---------- Où se trouve chaque pièce en ce moment ? ----------
    function trouverLieux(profil) {
      const lieux = {};

      if (profil.profileInventory && profil.profileInventory.data) {
        for (const objet of profil.profileInventory.data.items) {
          lieux[objet.itemInstanceId] = { zone: "coffre", idPerso: null };
        }
      }
      if (profil.characterInventories && profil.characterInventories.data) {
        for (const id in profil.characterInventories.data) {
          for (const objet of profil.characterInventories.data[id].items) {
            lieux[objet.itemInstanceId] = { zone: "inventaire", idPerso: id };
          }
        }
      }
      if (profil.characterEquipment && profil.characterEquipment.data) {
        for (const id in profil.characterEquipment.data) {
          for (const objet of profil.characterEquipment.data[id].items) {
            lieux[objet.itemInstanceId] = { zone: "equipee", idPerso: id };
          }
        }
      }
      return lieux;
    }

    // Déplace une pièce vers le coffre (versCoffre = true) ou depuis le coffre
    async function transferer(piece, idPerso, versCoffre) {
      await envoyerBungie("/Destiny2/Actions/Items/TransferItem/", {
        itemReferenceHash: piece.hash,
        stackSize: 1,
        transferToVault: versCoffre,
        itemId: piece.idInstance,
        characterId: idPerso,
        membershipType: compte.membershipType
      });
      await pause(400);
    }

    // ---------- Équiper un set ----------
    async function equiperSet(set, idPersonnage) {
      viderJournal();

      try {
        const perso = personnages[idPersonnage];
        const classeDuSet = set.pieces && set.pieces[0] && set.pieces[0].classe;
        if (perso.classType !== classeDuSet) {
          ecrire("Ce set est pour la classe " + CLASSES[classeDuSet] +
                 " : choisis un personnage de cette classe.");
          return;
        }

        ecrire("Lecture de ton inventaire actuel...");
        const profil = await appelerBungie(
          "/Destiny2/" + compte.membershipType + "/Profile/" + compte.membershipId + "/?components=102,201,205,305"
        );
        const lieux = trouverLieux(profil);

        const aEquiper = [];

        const objetsDuSet = (set.pieces || []).concat(set.armes || []);
        for (const piece of objetsDuSet) {
          const lieu = lieux[piece.idInstance];

          if (!lieu) {
            ecrire(piece.nom + " : introuvable (supprimée ou démantelée ?).");
            continue;
          }

          try {
            if (lieu.zone === "equipee" && lieu.idPerso === idPersonnage) {
              ecrire(piece.nom + " : déjà équipée sur ce personnage.");
              continue;
            }
            if (lieu.zone === "equipee") {
              ecrire(piece.nom + " : équipée sur un autre personnage. " +
                     "Déséquipe-la d'abord dans le jeu (cas pas encore géré).");
              continue;
            }

            if (lieu.zone === "inventaire" && lieu.idPerso !== idPersonnage) {
              ecrire(piece.nom + " : transfert vers le coffre...");
              await transferer(piece, lieu.idPerso, true);
              lieu.zone = "coffre";
            }
            if (lieu.zone === "coffre") {
              ecrire(piece.nom + " : transfert vers ton personnage...");
              await transferer(piece, idPersonnage, false);
            }

            aEquiper.push(piece.idInstance);
            ecrire(piece.nom + " : prête à être équipée.");
          } catch (erreur) {
            ecrire(piece.nom + " : erreur (" + erreur.message + ")");
          }
        }

        if (aEquiper.length) {
          ecrire("Envoi de l'ordre d'équipement...");
          const resultat = await envoyerBungie("/Destiny2/Actions/Items/EquipItems/", {
            itemIds: aEquiper,
            characterId: idPersonnage,
            membershipType: compte.membershipType
          });
          ecrire("Réponse de Bungie : " + JSON.stringify(resultat));
          await pause(500);
        }

        const sockets = (profil.itemComponents && profil.itemComponents.sockets && profil.itemComponents.sockets.data) || {};
        let modsAppliques = 0;
        for (const piece of (set.pieces || [])) {
          for (const mod of (piece.mods || [])) {
            try {
              const actuel = sockets[piece.idInstance] && sockets[piece.idInstance].sockets && sockets[piece.idInstance].sockets[mod.socketIndex];
              if (actuel && Number(actuel.plugHash) === Number(mod.plugItemHash)) continue;
              await envoyerBungie("/Destiny2/Actions/Items/InsertSocketPlugFree/", {
                plug: { socketIndex: mod.socketIndex, socketArrayType: 0, plugItemHash: mod.plugItemHash },
                itemId: piece.idInstance,
                characterId: idPersonnage,
                membershipType: compte.membershipType
              });
              modsAppliques++;
              await pause(500);
            } catch (erreur) {
              ecrire(piece.nom + " : mod non appliqué (" + erreur.message + "). Vérifie l'énergie ou la prise.");
            }
          }
        }
        if (set.doctrine) {
          ecrire("Doctrine prévue : " + set.doctrine.nom + ". Vérifie ses aspects, fragments et capacités en jeu.");
        }
        ecrire(aEquiper.length || modsAppliques ? "Terminé : " + aEquiper.length + " objet(s) équipé(s), " + modsAppliques + " mod(s) appliqué(s)." : "Aucun changement nécessaire.");
      } catch (erreur) {
        ecrire("Erreur : " + erreur.message);
      }
    }

    // ---------- L'affichage ----------
    function afficherSets() {
      zoneSets.innerHTML = "";

      if (sets.length === 0) {
        zoneSets.textContent = "Aucun set sauvegardé : crée-en un depuis la page des armures.";
        return;
      }

      sets.forEach(function (set, indexSet) {
        const bloc = document.createElement("div");
        bloc.className = "set";

        const objets = (set.pieces || []).concat(set.armes || []);
        const noms = objets.map(function (p) { return p.nom; }).join(", ");
        const texte = document.createElement("span");
        texte.className = "set-summary";
        const detailsBuild = [];
        if (set.doctrine && set.doctrine.nom) detailsBuild.push("doctrine : " + set.doctrine.nom);
        texte.textContent = set.nom + " — " + (noms || "aucun équipement") + (detailsBuild.length ? " · " + detailsBuild.join(" · ") : "");

        const bouton = document.createElement("button");
        bouton.textContent = "Équiper ce set";
        bouton.addEventListener("click", async function () {
          const idPersonnage = set.characterId && personnages[set.characterId] ? set.characterId : choixPersonnage.value;
          choixPersonnage.value = idPersonnage;
          const perso = personnages[idPersonnage];
          const question = "Équiper « " + set.nom + " » sur " + CLASSES[perso.classType] + " ?";
          if (confirm(question)) {
            bouton.disabled = true;
            await equiperSet(set, idPersonnage);
            bouton.disabled = false;
          }
        });

        const boutonModifier = document.createElement("button");
        boutonModifier.textContent = "Modifier l’équipement";
        const editeur = document.createElement("section");
        editeur.className = "set-editor";
        editeur.hidden = true;
        boutonModifier.addEventListener("click", function () {
          editeur.hidden = !editeur.hidden;
          boutonModifier.textContent = editeur.hidden ? "Modifier l’équipement" : "Fermer la modification";
        });
        construireEditeur(set, editeur, indexSet);

        const actions = document.createElement("div");
        actions.className = "set-actions";
        actions.append(bouton, boutonModifier);
        bloc.appendChild(texte);
        const details = document.createElement("span");
        details.className = "set-details";
        details.textContent = "Classe : " + (CLASSES[classeDuSet(set)] || "inconnue");
        bloc.append(actions, editeur, details);
        zoneSets.appendChild(bloc);
      });
    }

    function classeDuSet(set) {
      if (set.classe !== undefined) return Number(set.classe);
      const piece = (set.pieces || []).find(function (objet) { return objet.classe !== undefined; });
      return piece ? Number(piece.classe) : -1;
    }

    function classeCompatible(objet, classe) {
      return objet.classe === undefined || Number(objet.classe) === -1 || Number(objet.classe) === 3 || Number(objet.classe) === Number(classe);
    }

    function equipementPourEmplacement(objets, emplacement) {
      return objets.find(function (objet) {
        return Number(objet.bucketHash) === Number(emplacement.bucket) || objet.emplacement === emplacement.nom;
      });
    }

    function labelObjet(objet) {
      return objet.nom + (objet.lieuLabel ? " · " + objet.lieuLabel : "");
    }

    function construireChamp(emplacement, courant, classe, type) {
      const ligne = document.createElement("label");
      ligne.className = "edit-field";
      const nom = document.createElement("span");
      nom.textContent = emplacement.nom;
      const select = document.createElement("select");
      select.dataset.bucket = String(emplacement.bucket);
      select.dataset.type = type;
      const compatibles = objetsDisponibles.filter(function (objet) {
        return Number(objet.bucketHash) === Number(emplacement.bucket) && classeCompatible(objet, classe);
      });
      if (courant && !compatibles.some(function (objet) { return String(objet.idInstance) === String(courant.idInstance); })) {
        compatibles.push(Object.assign({ lieuLabel: "Enregistré dans ce build" }, courant));
      }
      compatibles.sort(function (a, b) { return a.nom.localeCompare(b.nom, "fr"); });
      const vide = document.createElement("option");
      vide.value = "";
      vide.textContent = type === "arme" && !courant ? "Aucune arme enregistrée" : "Choisir une pièce…";
      select.appendChild(vide);
      for (const objet of compatibles) {
        if (!objet.idInstance) continue;
        const option = document.createElement("option");
        option.value = String(objet.idInstance);
        option.textContent = labelObjet(objet);
        select.appendChild(option);
      }
      if (courant && courant.idInstance) select.value = String(courant.idInstance);
      ligne.append(nom, select);
      return { ligne: ligne, select: select };
    }

    function construireEditeur(set, editeur, indexSet) {
      const classe = classeDuSet(set);
      const selectionsArmure = [];
      const selectionsArmes = [];
      for (const emplacement of ARMURES) {
        const courant = equipementPourEmplacement(set.pieces || [], emplacement);
        const champ = construireChamp(emplacement, courant, classe, "armure");
        selectionsArmure.push({ emplacement: emplacement, courant: courant, select: champ.select });
        editeur.appendChild(champ.ligne);
      }
      for (const emplacement of ARMES) {
        const courant = equipementPourEmplacement(set.armes || [], emplacement);
        const champ = construireChamp(emplacement, courant, classe, "arme");
        selectionsArmes.push({ emplacement: emplacement, courant: courant, select: champ.select });
        editeur.appendChild(champ.ligne);
      }

      const aide = document.createElement("p");
      aide.className = "editor-help";
      aide.textContent = "Choisis une autre pièce de ton coffre ou de tes personnages. Les mods d’armure déjà enregistrés sont gardés si tu conserves la pièce; une nouvelle pièce est ajoutée sans mods préconfigurés.";
      editeur.appendChild(aide);
      const actions = document.createElement("div");
      actions.className = "editor-actions";
      const enregistrer = document.createElement("button");
      enregistrer.type = "button";
      enregistrer.textContent = "Enregistrer l’équipement";
      enregistrer.addEventListener("click", function () {
        const nouvellesArmures = [];
        for (const selection of selectionsArmure) {
          const id = selection.select.value;
          const piece = objetsDisponibles.find(function (objet) { return String(objet.idInstance) === id; }) || selection.courant;
          if (!piece) {
            alert("Choisis une pièce pour l’emplacement « " + selection.emplacement.nom + " ».");
            return;
          }
          const resteIdentique = selection.courant && String(selection.courant.idInstance) === String(piece.idInstance);
          nouvellesArmures.push(Object.assign({}, piece, {
            emplacement: selection.emplacement.nom,
            classe: piece.classe === undefined ? classe : piece.classe,
            mods: resteIdentique ? (selection.courant.mods || []) : []
          }));
        }
        if (nouvellesArmures.filter(function (piece) { return piece.exotique; }).length > 1) {
          alert("Un build ne peut contenir qu’une seule armure exotique. Remplace l’une des deux pièces exotiques.");
          return;
        }
        const nouvellesArmes = [];
        for (const selection of selectionsArmes) {
          const id = selection.select.value;
          if (!id) {
            if (selection.courant) nouvellesArmes.push(selection.courant);
            continue;
          }
          const arme = objetsDisponibles.find(function (objet) { return String(objet.idInstance) === id; }) || selection.courant;
          if (arme) nouvellesArmes.push(Object.assign({}, arme, { emplacement: selection.emplacement.nom }));
        }
        sets[indexSet].pieces = nouvellesArmures;
        sets[indexSet].armes = nouvellesArmes;
        localStorage.setItem("setsArmures", JSON.stringify(sets));
        afficherSets();
        statut.textContent = "Équipement modifié et enregistré sur cet appareil.";
      });
      const annuler = document.createElement("button");
      annuler.type = "button";
      annuler.className = "cancel-edit";
      annuler.textContent = "Annuler";
      annuler.addEventListener("click", function () { editeur.hidden = true; });
      actions.append(enregistrer, annuler);
      editeur.appendChild(actions);
    }

    async function chargerObjetsDisponibles(profil) {
      const manifest = await appelerBungie("/Destiny2/Manifest/");
      const chemins = manifest.jsonWorldComponentContentPaths.fr || manifest.jsonWorldComponentContentPaths.en;
      const chemin = chemins.DestinyInventoryItemLiteDefinition || chemins.DestinyInventoryItemDefinition;
      const reponse = await VIGIE_BUNGIE.fetchPublic(chemin);
      if (!reponse.ok) throw new Error("Le manifeste des équipements Bungie n’a pas pu être chargé.");
      const definitions = await reponse.json();
      const lieux = trouverLieux(profil);
      const sources = [];
      function ajouter(liste, idPersonnage) {
        for (const objet of liste || []) sources.push({ objet: objet, idPersonnage: idPersonnage || null });
      }
      if (profil.profileInventory && profil.profileInventory.data) ajouter(profil.profileInventory.data.items);
      if (profil.characterInventories && profil.characterInventories.data) {
        for (const id in profil.characterInventories.data) ajouter(profil.characterInventories.data[id].items, id);
      }
      if (profil.characterEquipment && profil.characterEquipment.data) {
        for (const id in profil.characterEquipment.data) ajouter(profil.characterEquipment.data[id].items, id);
      }

      const vus = new Set();
      objetsDisponibles = [];
      for (const source of sources) {
        const objet = source.objet;
        if (!objet.itemInstanceId || vus.has(String(objet.itemInstanceId))) continue;
        const definition = definitions[objet.itemHash];
        const bucket = Number(definition && definition.inventory && definition.inventory.bucketTypeHash) || 0;
        const emplacementArmure = ARMURES.find(function (slot) { return slot.bucket === bucket; });
        const emplacementArme = ARMES.find(function (slot) { return slot.bucket === bucket; });
        if (!emplacementArmure && !emplacementArme) continue;
        vus.add(String(objet.itemInstanceId));
        const emplacement = emplacementArmure || emplacementArme;
        const lieu = lieux[objet.itemInstanceId];
        const personnage = source.idPersonnage && personnages[source.idPersonnage];
        let lieuLabel = "Emplacement inconnu";
        if (lieu && lieu.zone === "coffre") lieuLabel = "Coffre";
        else if (lieu && lieu.zone === "inventaire") lieuLabel = "Inventaire" + (personnage ? " de " + CLASSES[personnage.classType] : "");
        else if (lieu && lieu.zone === "equipee") lieuLabel = "Équipé" + (personnage ? " sur " + CLASSES[personnage.classType] : "");
        objetsDisponibles.push({
          nom: definition && definition.displayProperties && definition.displayProperties.name || "Objet inconnu",
          icone: definition && definition.displayProperties && definition.displayProperties.icon || "",
          idInstance: objet.itemInstanceId,
          hash: Number(objet.itemHash),
          bucketHash: bucket,
          emplacement: emplacement.nom,
          classe: definition && definition.classType,
          exotique: Boolean(emplacementArmure && definition.inventory && Number(definition.inventory.tierType) === 6),
          setHash: Number(definition && definition.equippingBlock && definition.equippingBlock.equipableItemSetHash) || 0,
          lieu: lieu && lieu.zone || "inconnu",
          lieuLabel: lieuLabel,
          idPersonnage: source.idPersonnage
        });
      }
    }

    async function charger() {
      if (!jeton) {
        statut.textContent = "Tu n'es pas connecté : repasse par la page de connexion.";
        return;
      }

      try {
        let memberships;
        try {
          memberships = await appelerBungie("/User/GetMembershipsForCurrentUser/");
        } catch (erreur) {
          const membershipId = sessionStorage.getItem("membershipId");
          memberships = await appelerBungie("/User/GetMembershipsById/" + membershipId + "/254/");
        }
        compte =
          memberships.destinyMemberships.find(function (m) {
            return m.membershipId === memberships.primaryMembershipId;
          }) || memberships.destinyMemberships[0];

        const profil = await appelerBungie(
          "/Destiny2/" + compte.membershipType + "/Profile/" + compte.membershipId + "/?components=102,200,201,205"
        );
        personnages = profil.characters.data;
        statut.textContent = "Lecture de ton coffre et de tes équipements…";
        await chargerObjetsDisponibles(profil);

        for (const id in personnages) {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = CLASSES[personnages[id].classType] + " - Puissance " + personnages[id].light;
          choixPersonnage.appendChild(option);
        }

        statut.textContent = "Connecté : " + compte.bungieGlobalDisplayName +
          ". Modifie tes pièces puis équipe le build en orbite ou à la tour.";
        afficherSets();
      } catch (erreur) {
        statut.textContent = "Erreur : " + erreur.message;
      }
    }

    charger();
  </script>
</body>
</html>
