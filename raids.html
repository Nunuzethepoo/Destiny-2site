<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Guides des raids Destiny 2 en français, stratégies et schémas tactiques.">
  <title>Guides de raids — VIGIE</title>
  <link rel="stylesheet" href="vigie.css"><script src="vigie-shell.js" defer></script>
  <style>
    .raid-intro{max-width:760px;color:var(--muted);line-height:1.65}.raid-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;margin:18px 0;border:1px solid var(--line);border-radius:4px;background:linear-gradient(145deg,#141d27,#10161e)}.raid-toolbar label{display:grid;gap:7px;color:#aeb9c5;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.raid-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:17px 0;color:var(--muted);font-size:11px}.raid-summary strong{color:var(--gold);font:600 21px 'Barlow Condensed';letter-spacing:.6px;text-transform:uppercase}.encounter-nav{display:flex;gap:7px;overflow-x:auto;padding:2px 0 13px}.encounter-nav button{flex:none;border-color:#344353;background:#111821;color:#c6d0d9}.encounter-nav button[aria-pressed="true"]{border-color:var(--gold);background:#e6bb7215;color:var(--gold)}.encounter-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.9fr);gap:14px;align-items:start}.encounter-card,.map-card{min-width:0;border:1px solid var(--line);border-radius:4px;background:linear-gradient(145deg,#141d27,#10161e);padding:17px}.encounter-card h2{margin:0 0 8px;color:var(--gold)}.encounter-lead{color:#d9e1e8;line-height:1.65}.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;margin:14px 0}.role{padding:9px;border:1px solid #ffffff12;border-radius:3px;background:#0c1219}.role b{display:block;margin-bottom:4px;color:var(--cyan);font-size:10px;text-transform:uppercase;letter-spacing:.05em}.role span{color:#c4ccd5;font-size:11px;line-height:1.5}.steps{padding-left:21px;color:#c4ccd5;line-height:1.7}.steps li{padding:3px 0 5px}.callout{padding:11px 12px;border-left:2px solid var(--gold);background:#e6bb720b;color:#c8d0d8;font-size:11px;line-height:1.6}.map-card h2{margin:0 0 4px;font-size:18px}.map-note{margin:0 0 12px;color:#8e9ba9;font-size:10px;line-height:1.5}.tactical-map{display:block;width:100%;height:auto;border:1px solid #ffffff13;border-radius:3px;background:#0b1117}.map-legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin:10px 0 0;color:#aab5c0;font-size:9px}.map-legend span{display:flex;align-items:center;gap:5px}.map-dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}.raid-links{display:flex;flex-wrap:wrap;gap:12px;margin:15px 0 30px;font-size:10px}@media(max-width:760px){.raid-toolbar,.encounter-layout{grid-template-columns:1fr}.map-card{order:-1}.raid-summary{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <h1>Guides de raids</h1>
  <p class="raid-intro">Prépare ta prochaine escouade : sélectionne un raid puis une rencontre pour afficher les rôles, les étapes clés et un schéma tactique annoté. Les guides résument la stratégie standard ; les mécaniques peuvent varier avec les défis.</p>
  <section class="raid-toolbar" aria-label="Choisir un raid">
    <label>Raid<select id="raidSelect"></select></label><label>Rencontre<select id="encounterSelect"></select></label>
  </section>
  <div class="raid-summary"><strong id="raidTitle"></strong><span id="raidMeta"></span></div>
  <nav id="encounterNav" class="encounter-nav" aria-label="Rencontres du raid"></nav>
  <section class="encounter-layout" aria-live="polite"><article id="encounterCard" class="encounter-card"></article><aside id="mapCard" class="map-card"></aside></section>
  <p id="raidLinks" class="raid-links"></p>
  <script src="raids.js"></script>
</body>
</html>
